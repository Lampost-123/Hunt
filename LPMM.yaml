version: 3
spec: 254
entry: main

config:
  exhilaration_hp_pct:
    label: "Exhilaration HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  survival_of_the_fittest_hp_pct:
    label: "Survival of the Fittest HP%"
    type: slider
    min: 0
    max: 100
    default: 50

variables:
  trueshot_ready: "!talent.bullseye|fight_remains>cooldown.trueshot.duration+10|buff.bullseye.stack=buff.bullseye.max_stack|fight_remains<25|combat.time<10"

lists:
  defensives:
    - exhilaration,range_check=none,if=health.pct<=config.exhilaration_hp_pct
    - survival_of_the_fittest,range_check=none,if=health.pct<=config.survival_of_the_fittest_hp_pct

  cds:
    - berserking,if=buff.trueshot.up|fight_remains<13
    - blood_fury,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    - ancestral_call,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    - fireblood,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<9
    - lights_judgment,if=buff.trueshot.down

  trinkets:
    - trinket_1,if=trinket_1.sync&trinket_1.has_stat&(trinket_1.cd%%cooldown.trueshot.duration=0)&(buff.trueshot.remains>14|(trinket_1.id=193701&var.trueshot_ready&cooldown.trueshot.remains<5))
    - trinket_2,if=trinket_2.sync&trinket_2.has_stat&(trinket_2.cd%%cooldown.trueshot.duration=0)&(buff.trueshot.remains>14|(trinket_2.id=193701&var.trueshot_ready&cooldown.trueshot.remains<5))
    - trinket_1,if=trinket_1.sync&trinket_1.has_stat&trinket_2.has_stat&(trinket_2.cd%%cooldown.trueshot.duration=0)&((buff.trueshot.remains>14&!trinket_2.ready)|(cooldown.trueshot.remains>20&trinket_2.cd<=cooldown.trueshot.remains))
    - trinket_2,if=trinket_2.sync&trinket_2.has_stat&trinket_1.has_stat&(trinket_1.cd%%cooldown.trueshot.duration=0)&((buff.trueshot.remains>14&!trinket_1.ready)|(cooldown.trueshot.remains>20&trinket_1.cd<=cooldown.trueshot.remains))
    - trinket_1,if=trinket_1.sync&trinket_1.has_stat&(buff.trueshot.remains>14|(buff.trueshot.up&fight_remains<cooldown.trueshot.remains+15)|fight_remains<21)
    - trinket_2,if=trinket_2.sync&trinket_2.has_stat&(buff.trueshot.remains>14|(buff.trueshot.up&fight_remains<cooldown.trueshot.remains+15)|fight_remains<21)
    - trinket_1,if=trinket_1.sync&!trinket_1.has_stat&cooldown.trueshot.remains>20
    - trinket_2,if=trinket_2.sync&!trinket_2.has_stat&cooldown.trueshot.remains>20

  draoe:
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time&cooldown.aimed_shot.full_recharge_time<gcd+action.aimed_shot.cast_time
    - black_arrow,if=buff.precise_shots.up
    - multishot,if=buff.precise_shots.up&!talent.aspect_of_the_hydra&!prev_gcd.1.multishot|buff.trick_shots.down
    - trueshot,if=!buff.double_tap.up&var.trueshot_ready
    - rapid_fire,if=buff.trick_shots.remains>action.rapid_fire.execute_time&(buff.bulletstorm.remains<action.aimed_shot.execute_time|talent.unload)
    - wailing_arrow,if=!cooldown.black_arrow.ready
    - volley,if=!buff.double_tap.up
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time
    - multishot,if=buff.precise_shots.up
    - explosive_shot
    - steady_shot,ignore_movement=true

  drst:
    - black_arrow,if=buff.precise_shots.up
    - aimed_shot,if=(buff.trueshot.up&buff.precise_shots.down&cooldown.black_arrow.ready)|(cooldown.aimed_shot.full_recharge_time<gcd+action.aimed_shot.cast_time)
    - trueshot,if=!buff.double_tap.up&var.trueshot_ready
    - rapid_fire
    - wailing_arrow,if=!cooldown.black_arrow.ready
    - arcane_shot,if=buff.precise_shots.up
    - volley,if=!buff.double_tap.up
    - aimed_shot
    - explosive_shot
    - steady_shot,ignore_movement=true

  sentaoe:
    - multishot,if=buff.precise_shots.up&!talent.aspect_of_the_hydra&!prev_gcd.1.multishot|buff.trick_shots.down
    - rapid_fire,if=(buff.bulletstorm.remains<action.aimed_shot.execute_time|buff.bulletstorm.stack<18|talent.unload&target.health.pct<20)
    - trueshot,if=!buff.double_tap.up&var.trueshot_ready
    - volley,if=!buff.double_tap.up&!cooldown.trueshot.ready
    - explosive_shot,if=talent.shrapnel_shot&buff.trueshot.down&buff.lock_and_load.down&cooldown.aimed_shot.charges_fractional<=1.1
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time
    - moonlight_chakram
    - rapid_fire,if=buff.trick_shots.remains>action.rapid_fire.execute_time
    - multishot,if=buff.precise_shots.up&talent.windrunner_quiver
    - explosive_shot
    - steady_shot,ignore_movement=true

  sentst:
    - aimed_shot,if=buff.lock_and_load.up|prev_gcd.1.explosive_shot
    - arcane_shot,interrupt=true,if=(prev_gcd.1.aimed_shot|player.casting.19434)&buff.precise_shots.up
    - rapid_fire,if=buff.bulletstorm.down|buff.bulletstorm.remains<action.aimed_shot.execute_time
    - trueshot,if=!buff.double_tap.up
    - volley,if=!buff.double_tap.up&!cooldown.trueshot.ready
    - explosive_shot,if=buff.trueshot.down&cooldown.aimed_shot.charges_fractional<1
    - aimed_shot,if=buff.bulletstorm.up&cooldown.aimed_shot.ready
    - moonlight_chakram
    - rapid_fire
    - arcane_shot,if=buff.precise_shots.up
    - explosive_shot
    - steady_shot,ignore_movement=true

  precombat:
    - trinket_1,if=trinket_1.id=193701&trinket_1.usable
    - trinket_2,if=trinket_2.id=193701&trinket_2.usable
    - call_pet_1,if=talent.unbreakable_bond

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - call_action_list,name=precombat,if=!player.combat

    - return,if=auto_combat.player

    - call_action_list,name=defensives

    - counter_shot,if=interrupt.target.check
    - counter_shot.mouseover,if=interrupt.mouseover.check
    - counter_shot.focus,if=interrupt.focus.check
    - intimidation,if=interrupt.cc.check
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    - return,if=auto_combat.target

    - call_action_list,name=cds

    - call_action_list,name=trinkets

    - call_action_list,name=draoe,if=enemies_around_target>2&talent.trick_shots&hero_tree.dark_ranger
    - call_action_list,name=sentaoe,if=enemies_around_target>2&talent.trick_shots&hero_tree.sentinel
    - call_action_list,name=drst,if=hero_tree.dark_ranger
    - call_action_list,name=sentst,if=hero_tree.sentinel
