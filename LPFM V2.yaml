version: 3
spec: 64
name: "LPFM V2"
author: "LP"
description: "Spellslinger Frost Mage rotation optimized for Patch 12.0.5 Midnight M+"
entry: main

config:
  ice_barrier_hp_pct:
    label: "Ice Barrier HP%"
    type: slider
    min: 0
    max: 100
    default: 70

  ice_cold_hp_pct:
    label: "Ice Cold HP%"
    type: slider
    min: 0
    max: 100
    default: 35

  aoe_threshold:
    label: "AoE Enemy Threshold"
    type: slider
    min: 2
    max: 10
    default: 3

  use_cds:
    label: "Use DPS Cooldowns"
    type: checkbox
    default: true

  auto_counterspell:
    label: "Auto Interrupt (Counterspell)"
    type: checkbox
    default: true

  auto_spellsteal:
    label: "Auto Spellsteal (Stealable Buffs)"
    type: checkbox
    default: true

  auto_swap_non_elites:
    label: "Auto Swap Off Non-Elites"
    type: checkbox
    default: false

variables:
  cs_on_cd: "!cooldown.counterspell.ready"

lists:

  defensives:
    - ice_cold,range_check=none,if=health.pct<=config.ice_cold_hp_pct&cooldown.ice_cold.charges>=1
    - ice_barrier,range_check=none,if=health.pct<=config.ice_barrier_hp_pct&!buff.ice_barrier.up&cooldown.ice_barrier.charges>=1
    - cold_snap,range_check=none,if=talent.cold_snap&(!cooldown.ice_cold.ready|!cooldown.ice_barrier.ready)&health.pct<=config.ice_cold_hp_pct*1.5

  interrupts:
    - return,if=!config.auto_counterspell
    - counterspell.focus,if=interrupt.focus.check
    - counterspell.mouseover,if=interrupt.mouseover.check
    - counterspell,if=interrupt.target.check
    - counterspell,if=interrupt.stun.aoe.check
    - dragons_breath,if=var.cs_on_cd&target.distance<=10&(interrupt.target.check|interrupt.stun.aoe.check)
    - supernova.focus,if=var.cs_on_cd&interrupt.focus.check
    - supernova.mouseover,if=var.cs_on_cd&interrupt.mouseover.check
    - supernova,if=var.cs_on_cd&(interrupt.target.check|interrupt.stun.aoe.check)

  utility:
    - return,if=!config.auto_spellsteal
    - remove_curse,delay=500,cycle=party,if=cycle.dispelable.list
    - spellsteal.focus,if=focus.enemy&focus.has_stealable
    - spellsteal.mouseover,if=mouseover.enemy&mouseover.has_stealable
    - spellsteal,if=target.enemy&target.has_stealable

  cds:
    - return,if=!config.use_cds
    - berserking,if=cooldown.frozen_orb.remains<2|debuff.freezing.stack>=14
    - blood_fury,if=cooldown.frozen_orb.remains<2|debuff.freezing.stack>=14
    - ancestral_call,if=cooldown.frozen_orb.remains<2|debuff.freezing.stack>=14
    - fireblood,if=cooldown.frozen_orb.remains<2|debuff.freezing.stack>=14
    - trinket_1,if=trinket_1.sync&(cooldown.frozen_orb.remains<2|debuff.freezing.stack>=14)
    - trinket_2,if=trinket_2.sync&(cooldown.frozen_orb.remains<2|debuff.freezing.stack>=14)

  ss_st:
    - flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    - ice_lance,if=buff.fingers_of_frost.react=2
    - frozen_orb
    - glacial_spike
    - ice_lance,if=debuff.freezing.react>=6|buff.fingers_of_frost.react
    - comet_storm,if=talent.comet_storm
    - flurry,if=cooldown_react
    - ray_of_frost,if=!player.moving&debuff.freezing.stack<14&!buff.fingers_of_frost.react&!buff.brain_freeze.react
    - frostbolt

  ss_aoe:
    - blizzard,if=buff.freezing_rain.up
    - flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    - ice_lance,if=buff.fingers_of_frost.react=2
    - frozen_orb
    - glacial_spike
    - comet_storm,if=talent.comet_storm
    - ice_lance,if=debuff.freezing.react>=6|buff.fingers_of_frost.react
    - flurry,if=cooldown_react
    - ray_of_frost,if=!player.moving&debuff.freezing.stack<14&!buff.fingers_of_frost.react&!buff.brain_freeze.react
    - blizzard,if=enemies_around_target>=5&talent.freezing_winds
    - frostbolt

  ss_tarswap:
    - blizzard,if=buff.freezing_rain.up
    - target_enemy,delay=1500,off_gcd=true,if=target.dummy&debuff.freezing.stack>=6&debuff.freezing.stack>nameplates.debuff.freezing.lowest
    - target_enemy,delay=1500,off_gcd=true,if=!target.dummy&enemies_around_target>=2&target.classification>3&target.combat&target.health.pct>=20&target.time_to_die>=5&debuff.freezing.stack>=6&debuff.freezing.stack>nameplates.debuff.freezing.lowest
    - target_enemy,delay=3000,off_gcd=true,if=config.auto_swap_non_elites&enemies_around_target>=2&!target.dummy&target.classification<=3
    - flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    - ice_lance,if=buff.fingers_of_frost.react=2
    - frozen_orb
    - glacial_spike
    - ice_lance,if=enemies_around_target<=2&debuff.freezing.react>=6
    - ice_lance,if=enemies_around_target>=3
    - flurry,if=cooldown_react
    - ray_of_frost,if=!player.moving&debuff.freezing.stack<14&!buff.fingers_of_frost.react&!buff.brain_freeze.react
    - call_action_list,name=ss_st

  movement:
    - blizzard,if=buff.freezing_rain.up&player.moving
    - ice_nova,if=talent.cone_of_frost&player.moving
    - cone_of_cold,if=talent.cone_of_frost&player.moving
    - ice_lance,if=player.moving

  precombat:
    - arcane_intellect,range_check=none,if=buff.arcane_intellect.down&!player.combat
    - summon_water_elemental,range_check=none,if=(!pet.exists|pet.dead)&!player.combat&!talent.lonely_winter
    - frostbolt,if=!player.combat&target.attackable

  auto_target:
    - call_action_list,name=auto_target_ranged
    - target_enemy,delay=200,off_gcd=true,if=player.combat&(!target.exists|!target.combat&!target.dummy|!target.valid&!target.dummy)&(enemies.combat.40y>=1|target.dummy)

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target
    - call_action_list,name=precombat,if=!player.combat
    - stoneform,delay=1000,if=player.dispelable.list
    - return,if=(!player.combat&!target.dummy)|(!target.combat&!target.dummy)|(!target.valid&!target.dummy)
    - call_action_list,name=defensives
    - call_action_list,name=interrupts
    - call_action_list,name=utility
    - call_action_list,name=cds
    - call_action_list,name=movement,if=player.moving
    - call_action_list,name=ss_aoe,if=enemies_around_target>=config.aoe_threshold
    - call_action_list,name=ss_tarswap,if=enemies_around_target>=2|target.dummy
    - call_action_list,name=ss_st
