# ==============================================================================
# Outlaw Rogue Rotation - LPOutlaw V1 (WoW Midnight 12.0.5)
# ==============================================================================
# AUTHOR: LP
# DESCRIPTION:
#   A highly optimized Outlaw Rogue rotation designed specifically for Patch 12.0.5
#   Midnight, focusing on Mythic+ and high-key utility. Supports both Trickster
#   (recommended for M+ due to Fazed 3-stack scaling) and Fatebound hero trees.
#
# TIPS & TRICKS IMPLEMENTED:
#   1. Reworked Roll the Bones: Normalizes RNG by using cumulative stages. Rerolls
#      only on Stage 1 or lower. Stage 2+ is maintained.
#   2. Keep It Rolling: Intelligently extends Stage 3+ buffs. Supports Stage 2
#      extensions when Adrenaline Rush / Loaded Dice is not imminent to avoid holding KIR.
#   3. Killing Spree Energy Cancel: Features safe-checking to interrupt/cancel
#      Killing Spree if Energy is about to cap (waste of CDR and resources).
#   4. Blade Flurry Cleave Positioning: Remember that Blade Flurry cleave originates
#      from you, not the target. Position yourself between mobs.
#   5. Blind / Sap Skip: Utilizes Blind and Shroud / Vanish tricks to skip packs.
#   6. Auto-Target Interrupts: Automatically target-swaps to casting enemies within
#      8 yards to cast Kick, Kidney Shot, or Blind, and swaps back.
# ==============================================================================

version: 3
class: rogue
spec: 260
name: "LPOutlaw V1"
author: "LP"
description: "Optimized Trickster & Fatebound Outlaw Rogue rotation for Patch 12.0.5 Midnight M+"
entry: main

movement_allowed: true

morphs:
  sinister_strike: ambush
  dispatch: coup_de_grace

config:
  mainhand_poison:
    label: "Main Hand Poison"
    type: dropdown
    default: 1
    options:
      - label: "Instant Poison"
        value: 1
      - label: "Deadly Poison"
        value: 2
      - label: "Wound Poison"
        value: 3

  offhand_poison:
    label: "Off Hand Poison"
    type: dropdown
    default: 1
    options:
      - label: "Crippling Poison"
        value: 1
      - label: "Numbing Poison"
        value: 2
      - label: "Atrophic Poison"
        value: 3

  auto_stealth:
    label: "Auto Stealth"
    type: checkbox
    default: true

  # === 12.0 ROLL THE BONES CONFIG ===
  rtb_reroll_stage:
    label: "RTB Reroll Stage"
    type: dropdown
    default: 1
    options:
      - label: "Stage 1 Only"
        value: 1
      - label: "No Buff Only"
        value: 0
    description: "Reroll at Stage 1 or only when no buff"

  keep_it_rolling_min_stage:
    label: "KIR Min Stage"
    type: dropdown
    default: 2
    options:
      - label: "Stage 2+"
        value: 2
      - label: "Stage 3+"
        value: 3
      - label: "Stage 4 Only"
        value: 4
    description: "Minimum stage to use Keep It Rolling"

  # === HERO TALENT SELECTION ===
  hero_tree:
    label: "Hero Talent Tree"
    type: dropdown
    default: 2
    options:
      - label: "Fatebound"
        value: 1
      - label: "Trickster"
        value: 2

  auto_defensives:
    label: "Auto Defensives"
    type: checkbox
    default: true
    description: "Automatically use defensive abilities"

  crimson_vial_hp:
    label: "Crimson Vial HP %"
    type: slider
    min: 20
    max: 80
    default: 50
    description: "Use Crimson Vial when health drops below this %"

  feint_hp:
    label: "Feint HP %"
    type: slider
    min: 20
    max: 90
    default: 60
    description: "Use Feint when health drops below this %"

  interrupt_timing:
    label: "Interrupt Delay (ms)"
    type: slider
    min: 0
    max: 1500
    default: 150
    description: "Delay before interrupt fires (humanization)"

  # === M+ AFFIX CONFIG ===
  affix_handling:
    label: "Auto Affix Handling"
    type: checkbox
    default: true
    description: "Automatically handle M+ affixes (Voidbound, Ascendant)"

  features:
    label: "Features"
    type: multi_select
    options:
      - label: "Auto Target Interrupts"
        value: 0
      - label: "Kidney Shot for Interrupts"
        value: 1
      - label: "Blind for Interrupts"
        value: 2
    default: [0,1,2]
    show_override: true

variables:
  # === TARGET STATE ===
  target_valid: target.exists&target.enemy&target.alive
  target_attackable: var.target_valid&target.range<=8
  enemies_in_melee: enemies.8y

  # === FEATURES FLAGS ===
  auto_target: config.features.has(0)
  use_kidney: config.features.has(1)
  use_blind: config.features.has(2)

  # === M+ AFFIX ===
  affix_priority_mode: config.affix_handling&(target.name="Void Emissary"|(target.name="Ascendant Orb"&target.casting))

  # === 12.0 ROLL THE BONES ===
  # Roll the Bones stage (1-4). Only one stage buff is active at a time.
  rtb_buffs: "buff.jackpot.up*4+buff.triple_threat.up*3+buff.double_trouble.up*2+buff.one_of_a_kind.up"
  # Remaining time on the active stage buff (sum works since only one is active at a time)
  rtb_remains: "buff.jackpot.remains+buff.triple_threat.remains+buff.double_trouble.remains+buff.one_of_a_kind.remains"
  rtb_up: var.rtb_buffs>0

  # === HERO TALENT TREES ===
  hero_tree_fatebound: config.hero_tree=1
  hero_tree_trickster: config.hero_tree=2

  # === CORE COMBAT STATE ===
  adrenaline_rush_up: buff.adrenaline_rush.up
  bte_ready: cooldown.between_the_eyes.ready
  killing_spree_ready: cooldown.killing_spree.ready
  opportunity_up: buff.opportunity.up
  audacity_up: buff.audacity.up
  slice_and_dice_up: buff.slice_and_dice.up
  stealth_up: buff.stealth.up
  vanish_up: buff.vanish.up
  shadow_dance_up: buff.shadow_dance.up
  subterfuge_up: buff.subterfuge.up
  in_stealth: var.stealth_up|var.vanish_up|var.shadow_dance_up

  # === FINISHER CONDITION FROM SIMC (12.0.5 Midnight) ===
  finish_condition: combo_points>=combo_points.max-1-(var.hero_tree_fatebound&!var.bte_ready)|(var.killing_spree_ready&combo_points>=5)

  # === HEALTH ===
  health_critical: player.health.pct<30

  # === INTERRUPT SYSTEM ===
  kick_ready: cooldown.kick.ready
  kidney_ready: cooldown.kidney_shot.ready
  blind_ready: cooldown.blind.ready
  enough_cp_for_kidney: combo_points>=4

  # Is current target casting something we can interrupt or stun
  target_is_kickable: target.incoming_cast.kickable.up
  target_is_stunnable: target.incoming_cast.stunnable.up
  target_needs_interrupt: target.incoming_cast.kickable.up|target.incoming_cast.stunnable.up

  # Is there ANY enemy nearby casting something we can deal with
  any_kickable_8y: incoming_cast.8y.kickable.up
  any_stunnable_8y: incoming_cast.8y.stunnable.up
  any_interrupt_8y: incoming_cast.8y.kickable.up|incoming_cast.8y.stunnable.up

  # Mouseover / Focus
  mouseover_kickable: mouseover.incoming_cast.kickable.up
  mouseover_stunnable: mouseover.incoming_cast.stunnable.up
  focus_kickable: focus.incoming_cast.kickable.up
  focus_stunnable: focus.incoming_cast.stunnable.up

  # === POISON STATE ===
  mainhand_poison_up: buff.instant_poison.up|buff.deadly_poison.up|buff.wound_poison.up
  offhand_poison_up: buff.crippling_poison.up|buff.numbing_poison.up|buff.atrophic_poison.up

  # === AOE ===
  aoe_active: active_enemies>1

lists:

  spell_queue:
    - queue_spell

  sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs
    - return,if=player.loot_nearby
    - return,if=player.casting

  # === OUT OF COMBAT: Weapon poisons and stealth maintenance ===
  out_of_combat:
    - instant_poison,range_check=none,if=config.mainhand_poison=1&!buff.instant_poison.up&!player.mounted&!prev_gcd.1.instant_poison
    - deadly_poison,range_check=none,if=config.mainhand_poison=2&!buff.deadly_poison.up&!player.mounted&!prev_gcd.1.deadly_poison
    - wound_poison,range_check=none,if=config.mainhand_poison=3&!buff.wound_poison.up&!player.mounted&!prev_gcd.1.wound_poison
    - crippling_poison,range_check=none,if=config.offhand_poison=1&!buff.crippling_poison.up&!player.mounted&!prev_gcd.1.crippling_poison
    - numbing_poison,range_check=none,if=config.offhand_poison=2&!buff.numbing_poison.up&!player.mounted&!prev_gcd.1.numbing_poison
    - atrophic_poison,range_check=none,if=config.offhand_poison=3&!buff.atrophic_poison.up&!player.mounted&!prev_gcd.1.atrophic_poison
    - stealth,range_check=none,if=config.auto_stealth&cooldown.stealth.ready&!player.mounted&!var.stealth_up&!player.casting

  trinkets:
    - trinket_1,if=trinket_1.ready&(buff.between_the_eyes.up|trinket_1.usable|fight_remains<=20)
    - trinket_2,if=trinket_2.ready&(buff.between_the_eyes.up|trinket_2.usable|fight_remains<=20)

  # === INTERRUPTS: High priority M+ kick, stun, and disorient stops using shared expressions ===
  interrupts:
    # --- Auto-target: only fires in combat, stops the moment current target needs an interrupt ---
    - target_enemy,if=player.combat&var.any_interrupt_8y&!var.target_needs_interrupt&(var.kick_ready|var.kidney_ready|var.blind_ready)&var.auto_target

    # --- Kick: primary ---
    - kick,delay=config.interrupt_timing,if=interrupt.target.check

    # --- Kidney Shot: kickable OR stunnable when kick is down, no CP minimum for interrupt use ---
    - kidney_shot,delay=config.interrupt_timing,if=interrupt.cc.check&var.use_kidney

    # --- Blind: kickable OR stunnable when kick and kidney are down ---
    - blind,delay=config.interrupt_timing,if=interrupt.cc.check&!var.kick_ready&!var.kidney_ready&var.use_blind

    # --- Stun fallbacks ---
    - cheap_shot,delay=config.interrupt_timing,if=interrupt.cc.check
    - gouge,delay=config.interrupt_timing,if=interrupt.cc.check

    # --- Mouseover ---
    - kick.mouseover,delay=config.interrupt_timing,if=interrupt.mouseover.check
    - kidney_shot.mouseover,delay=config.interrupt_timing,if=interrupt.stun.mouseover.check&var.use_kidney
    - blind.mouseover,delay=config.interrupt_timing,if=interrupt.stun.mouseover.check&!var.kick_ready&!var.kidney_ready&var.use_blind

    # --- Focus ---
    - kick.focus,delay=config.interrupt_timing,if=interrupt.focus.check
    - kidney_shot.focus,delay=config.interrupt_timing,if=interrupt.stun.focus.check&var.use_kidney
    - blind.focus,delay=config.interrupt_timing,if=interrupt.stun.focus.check&!var.kick_ready&!var.kidney_ready&var.use_blind

  defensives:
    - cloak_of_shadows,range_check=none,if=player.combat.time>5&cooldown.cloak_of_shadows.ready&!buff.cloak_of_shadows.up&player.has_magic_debuff
    - feint,range_check=none,if=cooldown.feint.charges>=1&!buff.feint.up&player.health.pct<config.feint_hp
    - evasion,if=cooldown.evasion.ready&!buff.evasion.up&(defensives.ready|var.health_critical)
    - crimson_vial,range_check=none,if=player.health.pct<config.crimson_vial_hp&cooldown.crimson_vial.ready
    - healthstone,if=healthstone.ready&var.health_critical
    - health_potion,if=health_potion.ready&var.health_critical&!healthstone.ready

  utility:


  # === AFFIX ABILITIES: Priority-burn and crowd control for M+ affixes ===
  affix_abilities:
    # - blind,delay=config.interrupt_timing,if=target.name="Ascendant Orb"&target.casting&var.blind_ready
    # - cloak_of_shadows,range_check=none,if=cooldown.cloak_of_shadows.ready&!buff.cloak_of_shadows.up&defensives.ready.magic
    # - feint,range_check=none,if=cooldown.feint.charges>=1&!buff.feint.up&player.health.pct<config.feint_hp
    # - evasion,if=cooldown.evasion.ready&!buff.evasion.up&(defensives.ready|var.health_critical)
    # - crimson_vial,range_check=none,if=player.health.pct<config.crimson_vial_hp&cooldown.crimson_vial.ready
    # - adrenaline_rush,if=!var.adrenaline_rush_up
    # - blade_flurry,if=var.enemies_in_melee>=2&buff.blade_flurry.remains<gcd
    # - roll_the_bones,if=!var.rtb_up
    # - trinket_1,if=trinket_1.ready
    # - trinket_2,if=trinket_2.ready
    # - between_the_eyes,if=combo_points>=combo_points.max-1
    # - dispatch,if=combo_points>=combo_points.max-1
    # - ambush,if=talent.hidden_opportunity&var.audacity_up
    # - pistol_shot,if=var.opportunity_up
    # - ambush,if=talent.hidden_opportunity
    # - sinister_strike

  # === OPENER: Specialized 12.0.5 sequence to build and dump to 6+ CP ===
  opener:
    - adrenaline_rush,if=!var.adrenaline_rush_up&cooldown.adrenaline_rush.ready&var.hero_tree_trickster
    # - ambush,if=combo_points<5
    - sinister_strike,if=combo_points<5

  # === COOLDOWNS: Major offensive cooldown logic including RtB stage system ===
  cooldowns:
    # Cast Adrenaline Rush on cooldown at 2 or fewer combo points to avoid overcapping
    - adrenaline_rush,if=!var.adrenaline_rush_up&combo_points<=2
    
    # Reset primary CDR cooldowns using Preparation (Ensure AR is NOT ready and not active)
    - preparation,if=!cooldown.adrenaline_rush.ready&cooldown.adrenaline_rush.remains>30&!var.bte_ready&!cooldown.blade_rush.ready&(!var.killing_spree_ready|!var.hero_tree_trickster)|fight_remains<30
    
    # Keep It Rolling (KIR) - Intelligent stage logic
    - keep_it_rolling,if=var.rtb_buffs=2&var.rtb_remains<cooldown.adrenaline_rush.remains&!buff.loaded_dice.up&(cooldown.preparation.remains|!talent.preparation)|var.rtb_buffs>=3
    
    # Roll the Bones stage-based rerolling (Rerolling only at Stage 1 or less)
    - roll_the_bones,if=var.rtb_buffs=0|var.rtb_buffs=1
    
    # Blade Rush used on cooldown as builder and vital energy replenisher (only from melee range)
    - blade_rush,if=target.range<=8&(set_bonus.mid1_4pc&!buff.whirl_of_blades.up|var.enemies_in_melee=1&energy.time_to_max>2|var.enemies_in_melee>=2)
    
    # Out of combat stealth builders / Shadowmeld / Vanish
    - vanish,if=!var.finish_condition&talent.hidden_opportunity&!var.audacity_up&!var.opportunity_up
    - shadowmeld,if=!var.finish_condition&talent.hidden_opportunity&!var.audacity_up&!var.opportunity_up
    - combat_potion,if=combat_potion.ready&(buff.bloodlust.up|fight_remains<30|var.adrenaline_rush_up)
    - blood_fury
    - berserking
    - fireblood
    - ancestral_call

  # === FINISH: Finisher spending priorities (6+ CP, 5+ as Fatebound, 5+ for Killing Spree) ===
  finish:
    # Ensure Slice and Dice is applied/maintained via initial Dispatch
    - dispatch,if=!var.slice_and_dice_up
    
    # Between the Eyes on cooldown at max CP, optimized for Supercharger/Zero In
    - between_the_eyes,if=(cooldown.adrenaline_rush.remains>30|var.adrenaline_rush_up|!talent.supercharger|!talent.zero_in)&(combo_points>=6|var.hero_tree_fatebound)
    
    - pool_resource,for_next=1,if=var.killing_spree_ready&combo_points>=5
    
    # Killing Spree (Trickster must-use finisher). Cancels early if we are going to overcap energy!
    - killing_spree,interrupt_if=energy.time_to_max<2,if=var.killing_spree_ready&combo_points>=5
    
    # Coup de Grace (Trickster mega finisher) / Dispatch (strictly 6+ CP for Trickster, 5+ for Fatebound)
    - coup_de_grace,if=combo_points>=6|var.hero_tree_fatebound
    - dispatch,if=combo_points>=6|var.hero_tree_fatebound

  # === BUILD: Optimized Combo Point generation (Fan the Hammer and opportunity tracking) ===
  build:
    - ambush,if=talent.hidden_opportunity&var.audacity_up
    - coup_de_grace,if=buff.disorienting_strikes.up
    - pistol_shot,if=talent.audacity&talent.hidden_opportunity&var.opportunity_up&!var.audacity_up
    
    # Spend Opportunity procs correctly under Fan the Hammer rules to avoid stack waste
    - pistol_shot,if=talent.fan_the_hammer&var.opportunity_up&(buff.opportunity.stack>=6|buff.opportunity.remains<2)
    - pistol_shot,if=talent.fan_the_hammer&var.opportunity_up&(combo_points.deficit>=(1+talent.quick_draw+(talent.quick_draw*talent.fan_the_hammer.rank))&(combo_points>1|var.rtb_stage<2|!talent.deal_fate))
    - pistol_shot,if=!talent.fan_the_hammer&var.opportunity_up&(energy.deficit>energy.regen*1.5|combo_points.deficit<=1|talent.quick_draw.enabled|talent.audacity.enabled&!var.audacity_up)
    
    - pool_resource,for_next=1,if=talent.hidden_opportunity
    - ambush,if=talent.hidden_opportunity
    - sinister_strike

  # === ENTRY POINT ===
  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    
    # Target fallback for melee range acquisition
    - target_enemy,if=(!target.valid|target.range>6)&enemies.6y>=1
    
    - call_action_list,name=out_of_combat,if=!player.combat
    - return,if=!player.combat
    - return,if=player.channeling
    - return,if=!target.exists|target.dead|!target.enemy

    # === PRECOMBAT: RTB at 8y, AR at 6y (Trickster only) | Fatebound RTB on Loaded Dice ===
    - roll_the_bones,if=!player.combat&var.stealth_up&!var.rtb_up&var.hero_tree_trickster&enemies.8y>=1
    - roll_the_bones,if=!player.combat&var.stealth_up&!var.rtb_up&var.hero_tree_fatebound&buff.loaded_dice.up&enemies.8y>=1
    - adrenaline_rush,if=!player.combat&!var.adrenaline_rush_up&var.stealth_up&cooldown.adrenaline_rush.ready&var.hero_tree_trickster&enemies.6y>=1

    # === BLADE FLURRY AOE TOP PRIORITY ===
    - blade_flurry,if=player.combat&var.enemies_in_melee>=2&buff.blade_flurry.remains<gcd
    - blade_flurry,if=player.combat&buff.blade_flurry.up&combo_points<=4&var.enemies_in_melee>=4

    # === AFFIX INTERCEPT ===
    - run_action_list,name=affix_abilities,if=player.combat&var.affix_priority_mode

    # === INTERRUPTS ===
    - call_action_list,name=interrupts

    # === DEFENSIVES ===
    - call_action_list,name=defensives,if=config.auto_defensives

    # === UTILITY ===
    - call_action_list,name=utility,if=var.target_attackable

    # === OPENER SEQUENCE ===
    - call_action_list,name=opener,if=player.combat.time<=5&var.in_stealth

    # === CORE COMBAT ROTATION ===
    - call_action_list,name=cooldowns,if=var.target_attackable
    - call_action_list,name=trinkets
    - run_action_list,name=finish,if=var.finish_condition
    - call_action_list,name=build

    # === RACIAL FILLERS ===
    - arcane_torrent,if=energy.deficit>=15+energy.regen
    - arcane_pulse
    - lights_judgment
    - bag_of_tricks
